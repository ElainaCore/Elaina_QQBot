<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>重复群成员</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f7fa;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --line: #dfe4ea;
      --text: #1f2933;
      --muted: #667085;
      --accent: #1677ff;
      --accent-hover: #0958d9;
      --accent-soft: #e8f3ff;
      --success: #16794a;
      --success-soft: #e8f7ef;
      --warning: #a15c00;
      --warning-soft: #fff5df;
      --danger: #c43232;
      --danger-soft: #fff0f0;
      --shadow: 0 1px 2px rgb(16 24 40 / 5%);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
      letter-spacing: 0;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-size: 14px;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    .page {
      max-width: 1500px;
      margin: 0 auto;
      padding: 20px;
    }

    .page-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .title-wrap {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 12px;
    }

    .title-icon {
      display: grid;
      flex: 0 0 40px;
      width: 40px;
      height: 40px;
      place-items: center;
      color: var(--accent);
      border: 1px solid #b9dcff;
      border-radius: 8px;
      background: var(--accent-soft);
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.3;
      font-weight: 650;
    }

    .subtitle {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .toolbar,
    .panel-head,
    .panel-actions,
    .result-tools,
    .summary {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .field {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .field-label {
      white-space: nowrap;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    select,
    .search {
      height: 36px;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      outline: none;
      background: var(--surface);
    }

    select {
      min-width: 190px;
      padding: 0 34px 0 10px;
    }

    select:focus,
    .search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgb(22 119 255 / 12%);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 0 13px;
      gap: 7px;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      font-weight: 600;
      white-space: nowrap;
    }

    .btn:hover:not(:disabled) {
      border-color: #a9b4c2;
      background: var(--surface-2);
    }

    .btn.primary {
      color: white;
      border-color: var(--accent);
      background: var(--accent);
    }

    .btn.primary:hover:not(:disabled) {
      border-color: var(--accent-hover);
      background: var(--accent-hover);
    }

    .btn.danger {
      color: white;
      border-color: var(--danger);
      background: var(--danger);
    }

    .btn.danger:hover:not(:disabled) {
      border-color: #a92525;
      background: #a92525;
    }

    .btn.subtle {
      min-height: 30px;
      padding: 0 9px;
      color: var(--muted);
      border-color: transparent;
      background: transparent;
      font-size: 12px;
    }

    .btn.subtle:hover:not(:disabled) {
      color: var(--text);
      border-color: var(--line);
      background: var(--surface-2);
    }

    .icon {
      width: 16px;
      height: 16px;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(300px, 370px) minmax(0, 1fr);
      align-items: start;
      gap: 16px;
    }

    .panel {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-head {
      min-height: 54px;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
    }

    .panel-title {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 8px;
      font-size: 14px;
      font-weight: 650;
    }

    .count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 20px;
      padding: 0 6px;
      color: var(--accent);
      border-radius: 10px;
      background: var(--accent-soft);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .group-controls {
      padding: 12px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-2);
    }

    .search-wrap {
      position: relative;
    }

    .search-wrap .icon {
      position: absolute;
      z-index: 1;
      top: 10px;
      left: 10px;
      width: 15px;
      height: 15px;
      color: var(--muted);
      pointer-events: none;
    }

    .search {
      width: 100%;
      padding: 0 10px 0 34px;
    }

    .group-list {
      height: min(570px, calc(100vh - 260px));
      min-height: 320px;
      overflow: auto;
      overscroll-behavior: contain;
    }

    .group-item {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) auto;
      align-items: center;
      min-height: 60px;
      padding: 9px 13px;
      gap: 10px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      transition: background-color .12s ease;
    }

    .group-item:last-child {
      border-bottom: 0;
    }

    .group-item:hover {
      background: var(--surface-2);
    }

    .group-item.selected {
      background: var(--accent-soft);
    }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--accent);
    }

    .group-main,
    .member-main {
      min-width: 0;
    }

    .group-name,
    .member-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
    }

    .group-id,
    .member-id {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .member-count {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .compare-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 58px;
      padding: 10px 12px;
      gap: 10px;
      border-top: 1px solid var(--line);
      background: var(--surface);
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      color: var(--muted);
      gap: 7px;
      font-size: 12px;
      white-space: nowrap;
    }

    .result-panel {
      min-height: 520px;
    }

    .result-head {
      flex-wrap: wrap;
    }

    .result-tools {
      margin-left: auto;
    }

    .result-tools .search-wrap {
      width: min(260px, 30vw);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      padding: 12px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--line);
    }

    .metric {
      min-width: 0;
      padding: 8px 12px;
      border-right: 1px solid var(--line);
    }

    .metric:last-child {
      border-right: 0;
    }

    .metric-value {
      display: block;
      overflow: hidden;
      color: var(--text);
      font-size: 20px;
      line-height: 1.25;
      font-weight: 680;
      font-variant-numeric: tabular-nums;
      text-overflow: ellipsis;
    }

    .metric-label {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
    }

    .notice {
      display: none;
      margin: 12px 12px 0;
      padding: 9px 11px;
      border: 1px solid #f0ce8a;
      border-radius: 6px;
      color: var(--warning);
      background: var(--warning-soft);
      font-size: 12px;
      line-height: 1.5;
    }

    .notice.show {
      display: block;
    }

    .notice.danger {
      color: var(--danger);
      border-color: #e8a4a4;
      background: var(--danger-soft);
    }

    .bulk-bar {
      display: none;
      align-items: flex-start;
      padding: 10px 12px;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .bulk-bar.show {
      display: flex;
    }

    .bulk-select {
      display: inline-flex;
      flex: none;
      align-items: center;
      min-height: 30px;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .bulk-select strong {
      color: var(--text);
    }

    .target-groups {
      display: flex;
      flex: 1;
      flex-wrap: wrap;
      align-items: center;
      min-width: 0;
      gap: 6px;
    }

    .target-group {
      display: inline-flex;
      align-items: center;
      min-width: 0;
      max-width: 220px;
      min-height: 30px;
      padding: 0 8px;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--surface-2);
      cursor: pointer;
      font-size: 11px;
    }

    .target-group:has(input:checked) {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .target-group span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .bulk-actions {
      display: flex;
      flex: none;
      align-items: center;
      gap: 8px;
    }

    .results {
      max-height: min(560px, calc(100vh - 330px));
      min-height: 360px;
      overflow: auto;
    }

    .result-row {
      display: grid;
      grid-template-columns: 20px 42px minmax(130px, .8fr) minmax(250px, 1.7fr) 74px;
      align-items: center;
      min-height: 76px;
      padding: 10px 16px;
      gap: 12px;
      border-bottom: 1px solid var(--line);
    }

    .result-row:last-child {
      border-bottom: 0;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 50%;
      object-fit: cover;
      background: var(--surface-2);
    }

    .group-tags {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .group-tag {
      display: inline-flex;
      align-items: center;
      min-width: 0;
      max-width: 100%;
      height: 26px;
      padding: 0 8px;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--surface-2);
      font-size: 11px;
    }

    .group-tag-name {
      overflow: hidden;
      max-width: 160px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .group-tag-card {
      overflow: hidden;
      max-width: 120px;
      margin-left: 5px;
      color: var(--muted);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .overlap-count {
      justify-self: end;
      color: var(--success);
      font-weight: 650;
      white-space: nowrap;
    }

    .state {
      display: grid;
      min-height: 320px;
      padding: 30px;
      place-content: center;
      justify-items: center;
      color: var(--muted);
      text-align: center;
    }

    .state .state-icon {
      width: 42px;
      height: 42px;
      margin-bottom: 10px;
      color: #98a2b3;
    }

    .spinner {
      width: 28px;
      height: 28px;
      margin-bottom: 12px;
      border: 3px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    .toast {
      position: fixed;
      z-index: 20;
      top: 18px;
      left: 50%;
      max-width: min(500px, calc(100vw - 32px));
      padding: 10px 14px;
      color: white;
      border-radius: 6px;
      background: #323b47;
      box-shadow: 0 8px 24px rgb(16 24 40 / 20%);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -10px);
      transition: .18s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .toast.error {
      background: var(--danger);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 900px) {
      .page {
        padding: 14px;
      }

      .page-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .toolbar {
        width: 100%;
      }

      .field {
        min-width: 0;
        flex: 1;
      }

      select {
        width: 100%;
        min-width: 0;
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      .group-list {
        height: 330px;
        min-height: 280px;
      }

      .results {
        max-height: none;
      }
    }

    @media (max-width: 600px) {
      .page {
        padding: 10px;
      }

      .title-icon {
        display: none;
      }

      .toolbar,
      .compare-bar {
        align-items: stretch;
        flex-direction: column;
      }

      .toolbar .btn,
      .compare-bar .btn {
        width: 100%;
      }

      .panel-head {
        align-items: flex-start;
      }

      .result-head {
        flex-direction: column;
      }

      .result-tools {
        width: 100%;
        margin-left: 0;
      }

      .result-tools .search-wrap {
        width: 100%;
      }

      .bulk-bar {
        flex-direction: column;
      }

      .target-groups,
      .bulk-actions,
      .bulk-actions .btn {
        width: 100%;
      }

      .bulk-actions {
        align-items: stretch;
        flex-direction: column;
      }

      .summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .metric:nth-child(2) {
        border-right: 0;
      }

      .metric:nth-child(-n+2) {
        border-bottom: 1px solid var(--line);
      }

      .result-row {
        grid-template-columns: 20px 38px minmax(0, 1fr) auto;
        padding: 10px 12px;
        gap: 9px;
      }

      .group-tags {
        grid-column: 3 / -1;
        grid-row: 2;
      }

      .overlap-count {
        grid-column: 4;
        grid-row: 1;
      }

      .group-tag {
        max-width: calc(100vw - 92px);
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111419;
        --surface: #1a1e24;
        --surface-2: #20252c;
        --line: #303740;
        --text: #e6eaf0;
        --muted: #9aa4b2;
        --accent: #4096ff;
        --accent-hover: #1677ff;
        --accent-soft: #162b46;
        --success: #57c98d;
        --success-soft: #153327;
        --warning: #e6a84a;
        --warning-soft: #352814;
        --danger: #ef6b6b;
        --danger-soft: #3c2020;
        --shadow: none;
      }

      .title-icon {
        border-color: #254f78;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="page-head">
      <div class="title-wrap">
        <span class="title-icon" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </span>
        <div>
          <h1>重复群成员</h1>
          <div class="subtitle">群成员交集查询</div>
        </div>
      </div>
      <div class="toolbar">
        <label class="field">
          <span class="field-label">机器人</span>
          <select id="botSelect" aria-label="机器人账号"></select>
        </label>
        <button class="btn" id="refreshButton" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 6v6h-6"/><path d="M4 18v-6h6"/>
            <path d="M18.5 9a7 7 0 0 0-11.8-2.6L4 9M20 15l-2.7 2.6A7 7 0 0 1 5.5 15"/>
          </svg>
          刷新群列表
        </button>
      </div>
    </header>

    <section class="workspace">
      <aside class="panel">
        <div class="panel-head">
          <div class="panel-title">
            选择群
            <span class="count" id="selectedCount">0</span>
          </div>
          <div class="panel-actions">
            <button class="btn subtle" id="selectVisibleButton" type="button">选择当前结果</button>
            <button class="btn subtle" id="clearButton" type="button">清空</button>
          </div>
        </div>
        <div class="group-controls">
          <div class="search-wrap">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
            </svg>
            <input class="search" id="groupSearch" type="search" placeholder="搜索群名称或群号" autocomplete="off">
          </div>
        </div>
        <div class="group-list" id="groupList"></div>
        <div class="compare-bar">
          <label class="toggle">
            <input id="excludeSelf" type="checkbox" checked>
            排除机器人自身
          </label>
          <button class="btn primary" id="compareButton" type="button" disabled>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m9 18 6-6-6-6"/>
            </svg>
            开始对比
          </button>
        </div>
      </aside>

      <section class="panel result-panel">
        <div class="panel-head result-head">
          <div class="panel-title">
            对比结果
            <span class="count" id="resultCount">0</span>
          </div>
          <div class="result-tools">
            <div class="search-wrap">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
              </svg>
              <input class="search" id="resultSearch" type="search" placeholder="搜索昵称或 QQ" autocomplete="off">
            </div>
            <button class="btn" id="exportButton" type="button" disabled>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <path d="m7 10 5 5 5-5M12 15V3"/>
              </svg>
              导出 CSV
            </button>
          </div>
        </div>
        <div class="summary" id="summary">
          <div class="metric"><strong class="metric-value" id="metricGroups">0</strong><span class="metric-label">成功对比群</span></div>
          <div class="metric"><strong class="metric-value" id="metricRecords">0</strong><span class="metric-label">成员记录</span></div>
          <div class="metric"><strong class="metric-value" id="metricUnique">0</strong><span class="metric-label">去重成员</span></div>
          <div class="metric"><strong class="metric-value" id="metricDuplicates">0</strong><span class="metric-label">重复成员</span></div>
        </div>
        <div class="notice" id="failedNotice"></div>
        <div class="notice danger" id="actionNotice"></div>
        <div class="bulk-bar" id="bulkBar">
          <label class="bulk-select">
            <input id="selectAllResults" type="checkbox">
            已选 <strong id="selectedUserCount">0</strong> 名
          </label>
          <div class="target-groups" id="targetGroups"></div>
          <div class="bulk-actions">
            <label class="toggle">
              <input id="rejectAdd" type="checkbox">
              拒绝再次申请
            </label>
            <button class="btn danger" id="kickButton" type="button" disabled>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"/>
              </svg>
              移出所选群
            </button>
          </div>
        </div>
        <div class="results" id="results"></div>
      </section>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      'use strict';

      const API_ROOT = '/api/ext/group-member-overlap';
      const MAX_GROUPS = 50;
      const MAX_KICK_TARGETS = 200;
      const state = {
        bots: [],
        groups: [],
        selected: new Set(),
        duplicates: [],
        selectedUsers: new Set(),
        selectedTargetGroups: new Set(),
        stats: null,
        loadingGroups: false,
        comparing: false,
        kicking: false,
      };
      const elements = Object.fromEntries(
        [
          'botSelect', 'refreshButton', 'selectedCount', 'selectVisibleButton',
          'clearButton', 'groupSearch', 'groupList', 'excludeSelf',
          'compareButton', 'resultCount', 'resultSearch', 'exportButton',
          'metricGroups', 'metricRecords', 'metricUnique', 'metricDuplicates',
          'failedNotice', 'actionNotice', 'bulkBar', 'selectAllResults',
          'selectedUserCount', 'targetGroups', 'rejectAdd', 'kickButton',
          'results', 'toast',
        ].map((id) => [id, document.getElementById(id)])
      );
      let toastTimer = null;

      function iconState(path) {
        return '<svg class="state-icon icon" viewBox="0 0 24 24" aria-hidden="true">' + path + '</svg>';
      }

      function escapeHtml(value) {
        const div = document.createElement('div');
        div.textContent = String(value ?? '');
        return div.innerHTML;
      }

      function showToast(message, type = '') {
        clearTimeout(toastTimer);
        elements.toast.textContent = message;
        elements.toast.className = 'toast show' + (type ? ' ' + type : '');
        toastTimer = setTimeout(() => {
          elements.toast.className = 'toast';
        }, 3200);
      }

      async function request(url, options = {}) {
        const response = await fetch(url, {
          credentials: 'same-origin',
          ...options,
          headers: { Accept: 'application/json', ...(options.headers || {}) },
        });
        let body;
        try {
          body = await response.json();
        } catch {
          body = null;
        }
        if (!response.ok || !body || body.success === false) {
          const error = new Error(body?.message || body?.error || '请求失败');
          error.body = body;
          throw error;
        }
        return body;
      }

      function connectedBot(item) {
        return item && item.connected !== false && String(item.bot_qq || item.qq || '').trim();
      }

      async function loadBots() {
        const data = await request('/api/bots');
        state.bots = (Array.isArray(data.bots) ? data.bots : []).filter(connectedBot);
        const preferred = localStorage.getItem('elainaqq_bot') || '';
        elements.botSelect.replaceChildren();
        if (!state.bots.length) {
          const option = new Option('暂无在线机器人', '');
          elements.botSelect.add(option);
          elements.botSelect.disabled = true;
          return false;
        }
        for (const bot of state.bots) {
          const qq = String(bot.bot_qq || bot.qq);
          const name = String(bot.name || qq);
          elements.botSelect.add(new Option(name + ' (' + qq + ')', qq));
        }
        const initial = state.bots.some((bot) => String(bot.bot_qq || bot.qq) === preferred)
          ? preferred
          : String(state.bots[0].bot_qq || state.bots[0].qq);
        elements.botSelect.value = initial;
        elements.botSelect.disabled = false;
        return true;
      }

      function visibleGroups() {
        const query = elements.groupSearch.value.trim().toLocaleLowerCase();
        if (!query) return state.groups;
        return state.groups.filter((group) =>
          group.group_name.toLocaleLowerCase().includes(query) ||
          group.group_id.includes(query)
        );
      }

      function renderGroupList() {
        elements.selectedCount.textContent = String(state.selected.size);
        elements.botSelect.disabled = state.bots.length === 0 || state.comparing || state.kicking;
        elements.refreshButton.disabled = state.loadingGroups || state.comparing || state.kicking;
        elements.compareButton.disabled = state.comparing || state.kicking || state.selected.size < 2;
        elements.clearButton.disabled = state.selected.size === 0;
        const groups = visibleGroups();
        elements.selectVisibleButton.disabled = !groups.length;

        if (state.loadingGroups) {
          elements.groupList.innerHTML = '<div class="state"><span class="spinner"></span><span>正在加载群列表</span></div>';
          return;
        }
        if (!state.groups.length) {
          elements.groupList.innerHTML = '<div class="state">' +
            iconState('<circle cx="12" cy="12" r="9"/><path d="M8 12h8"/>') +
            '<span>当前账号没有可用群</span></div>';
          return;
        }
        if (!groups.length) {
          elements.groupList.innerHTML = '<div class="state">' +
            iconState('<circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>') +
            '<span>没有匹配的群</span></div>';
          return;
        }
        elements.groupList.innerHTML = groups.map((group) => {
          const checked = state.selected.has(group.group_id);
          return '<label class="group-item' + (checked ? ' selected' : '') + '">' +
            '<input type="checkbox" data-group-id="' + escapeHtml(group.group_id) + '"' + (checked ? ' checked' : '') + '>' +
            '<span class="group-main">' +
              '<span class="group-name" title="' + escapeHtml(group.group_name) + '">' + escapeHtml(group.group_name) + '</span>' +
              '<span class="group-id">' + escapeHtml(group.group_id) + '</span>' +
            '</span>' +
            '<span class="member-count">' + Number(group.member_count || 0).toLocaleString() + ' 人</span>' +
          '</label>';
        }).join('');
      }

      async function loadGroups() {
        const selfId = elements.botSelect.value;
        state.groups = [];
        state.selected.clear();
        state.loadingGroups = true;
        renderGroupList();
        try {
          const data = await request(API_ROOT + '/groups?self_id=' + encodeURIComponent(selfId));
          state.groups = Array.isArray(data.groups) ? data.groups : [];
        } catch (error) {
          showToast(error.message, 'error');
        } finally {
          state.loadingGroups = false;
          renderGroupList();
        }
      }

      function groupName(groupId) {
        const group = state.groups.find((item) => item.group_id === groupId);
        return group ? group.group_name : groupId;
      }

      function updateSummary() {
        const stats = state.stats || {};
        elements.metricGroups.textContent = Number(stats.compared_groups || 0).toLocaleString();
        elements.metricRecords.textContent = Number(stats.member_records || 0).toLocaleString();
        elements.metricUnique.textContent = Number(stats.unique_members || 0).toLocaleString();
        elements.metricDuplicates.textContent = Number(stats.duplicate_members || 0).toLocaleString();
      }

      function filteredDuplicates() {
        const query = elements.resultSearch.value.trim().toLocaleLowerCase();
        if (!query) return state.duplicates;
        return state.duplicates.filter((member) =>
          String(member.display_name).toLocaleLowerCase().includes(query) ||
          String(member.user_id).includes(query) ||
          member.groups.some((group) =>
            groupName(group.group_id).toLocaleLowerCase().includes(query) ||
            String(group.card || group.nickname || '').toLocaleLowerCase().includes(query)
          )
        );
      }

      function selectedMembers() {
        return state.duplicates.filter((member) => state.selectedUsers.has(String(member.user_id)));
      }

      function availableTargetGroups() {
        const groups = new Set();
        for (const member of selectedMembers()) {
          for (const group of member.groups) groups.add(String(group.group_id));
        }
        return Array.from(groups).sort((left, right) =>
          groupName(left).localeCompare(groupName(right), 'zh-CN')
        );
      }

      function batchTargets() {
        const targets = [];
        for (const member of selectedMembers()) {
          for (const group of member.groups) {
            const groupId = String(group.group_id);
            if (state.selectedTargetGroups.has(groupId)) {
              targets.push({ user_id: String(member.user_id), group_id: groupId });
            }
          }
        }
        return targets;
      }

      function renderBulkBar() {
        const members = selectedMembers();
        const availableGroups = availableTargetGroups();
        for (const groupId of Array.from(state.selectedTargetGroups)) {
          if (!availableGroups.includes(groupId)) state.selectedTargetGroups.delete(groupId);
        }
        elements.bulkBar.className = 'bulk-bar' + (members.length ? ' show' : '');
        elements.selectedUserCount.textContent = String(members.length);

        const visible = filteredDuplicates();
        elements.selectAllResults.checked = visible.length > 0 &&
          visible.every((member) => state.selectedUsers.has(String(member.user_id)));
        elements.selectAllResults.indeterminate = visible.some((member) =>
          state.selectedUsers.has(String(member.user_id))
        ) && !elements.selectAllResults.checked;

        elements.targetGroups.innerHTML = availableGroups.length
          ? availableGroups.map((groupId) =>
              '<label class="target-group" title="' + escapeHtml(groupName(groupId)) + '">' +
                '<input type="checkbox" data-target-group="' + escapeHtml(groupId) + '"' +
                  (state.selectedTargetGroups.has(groupId) ? ' checked' : '') + '>' +
                '<span>' + escapeHtml(groupName(groupId)) + '</span>' +
              '</label>'
            ).join('')
          : '<span class="field-label">选择用户后可选择目标群</span>';

        const operationCount = batchTargets().length;
        elements.kickButton.disabled = state.kicking || state.comparing ||
          operationCount === 0 || operationCount > MAX_KICK_TARGETS;
        elements.kickButton.title = operationCount > MAX_KICK_TARGETS
          ? '一次最多执行 ' + MAX_KICK_TARGETS + ' 个移群操作'
          : '';
        elements.kickButton.lastChild.textContent = state.kicking
          ? '处理中...'
          : operationCount > MAX_KICK_TARGETS
            ? '操作过多 (' + operationCount + ')'
            : '移出所选群' + (operationCount ? ' (' + operationCount + ')' : '');
      }

      function renderResults() {
        updateSummary();
        const members = filteredDuplicates();
        elements.resultCount.textContent = String(members.length);
        elements.exportButton.disabled = state.comparing || state.kicking || state.duplicates.length === 0;
        renderBulkBar();

        if (state.comparing) {
          elements.results.innerHTML = '<div class="state"><span class="spinner"></span><span>正在获取并对比群成员</span></div>';
          return;
        }
        if (!state.stats) {
          elements.results.innerHTML = '<div class="state">' +
            iconState('<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>') +
            '<span>暂无对比结果</span></div>';
          return;
        }
        if (!state.duplicates.length) {
          elements.results.innerHTML = '<div class="state">' +
            iconState('<path d="m5 12 4 4L19 6"/>') +
            '<span>所选群中没有重复成员</span></div>';
          return;
        }
        if (!members.length) {
          elements.results.innerHTML = '<div class="state">' +
            iconState('<circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>') +
            '<span>没有匹配的成员</span></div>';
          return;
        }

        elements.results.innerHTML = members.map((member) => {
          const tags = member.groups.map((group) => {
            const card = String(group.card || group.nickname || '');
            return '<span class="group-tag" title="' + escapeHtml(groupName(group.group_id) + (card ? ' / ' + card : '')) + '">' +
              '<span class="group-tag-name">' + escapeHtml(groupName(group.group_id)) + '</span>' +
              (card && card !== member.display_name ? '<span class="group-tag-card">' + escapeHtml(card) + '</span>' : '') +
            '</span>';
          }).join('');
          const avatar = 'https://q1.qlogo.cn/g?b=qq&nk=' + encodeURIComponent(member.user_id) + '&s=100';
          return '<article class="result-row">' +
            '<input type="checkbox" data-user-id="' + escapeHtml(member.user_id) + '"' +
              (state.selectedUsers.has(String(member.user_id)) ? ' checked' : '') +
              ' aria-label="选择 QQ ' + escapeHtml(member.user_id) + '">' +
            '<img class="avatar" src="' + avatar + '" alt="" loading="lazy" referrerpolicy="no-referrer">' +
            '<div class="member-main">' +
              '<div class="member-name" title="QQ ' + escapeHtml(member.user_id) + '">QQ ' + escapeHtml(member.user_id) + '</div>' +
              '<div class="member-id" title="' + escapeHtml(member.display_name) + '">' + escapeHtml(member.display_name) + '</div>' +
            '</div>' +
            '<div class="group-tags">' + tags + '</div>' +
            '<div class="overlap-count">' + member.group_count + ' 个群</div>' +
          '</article>';
        }).join('');
      }

      function renderFailedGroups(failedGroups) {
        const failed = Array.isArray(failedGroups) ? failedGroups : [];
        if (!failed.length) {
          elements.failedNotice.className = 'notice';
          elements.failedNotice.textContent = '';
          return;
        }
        elements.failedNotice.textContent = '未参与对比：' + failed
          .map((item) => groupName(String(item.group_id)) + '（' + item.message + '）')
          .join('；');
        elements.failedNotice.className = 'notice show';
      }

      function renderActionFailures(results) {
        const failed = (Array.isArray(results) ? results : []).filter((item) => !item.success);
        if (!failed.length) {
          elements.actionNotice.className = 'notice danger';
          elements.actionNotice.textContent = '';
          return;
        }
        elements.actionNotice.textContent = '移群失败：' + failed
          .map((item) => 'QQ ' + item.user_id + ' / ' + groupName(String(item.group_id)) + '（' + item.message + '）')
          .join('；');
        elements.actionNotice.className = 'notice danger show';
      }

      async function compare(options = {}) {
        if (state.selected.size < 2 || state.comparing) return;
        state.comparing = true;
        state.stats = null;
        state.duplicates = [];
        state.selectedUsers.clear();
        state.selectedTargetGroups.clear();
        renderFailedGroups([]);
        if (!options.preserveActionNotice) renderActionFailures([]);
        renderGroupList();
        renderResults();
        try {
          const data = await request(API_ROOT + '/compare', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              self_id: elements.botSelect.value,
              group_ids: Array.from(state.selected),
              exclude_self: elements.excludeSelf.checked,
            }),
          });
          state.stats = data.stats || {};
          state.duplicates = Array.isArray(data.duplicates) ? data.duplicates : [];
          renderFailedGroups(data.failed_groups);
          if (!options.silent) {
            showToast('对比完成，共发现 ' + state.duplicates.length + ' 名重复成员');
          }
          return true;
        } catch (error) {
          state.stats = null;
          renderFailedGroups(error.body?.failed_groups);
          showToast(error.message, 'error');
          return false;
        } finally {
          state.comparing = false;
          renderGroupList();
          renderResults();
        }
      }

      async function kickSelected() {
        const targets = batchTargets();
        if (!targets.length || state.kicking) return;
        if (targets.length > MAX_KICK_TARGETS) {
          showToast('一次最多执行 ' + MAX_KICK_TARGETS + ' 个移群操作', 'error');
          return;
        }
        const userCount = selectedMembers().length;
        const groupCount = state.selectedTargetGroups.size;
        const confirmed = window.confirm(
          '确认对 ' + userCount + ' 名用户执行 ' + targets.length +
          ' 项移群操作？\\n涉及 ' + groupCount + ' 个目标群。'
        );
        if (!confirmed) return;

        state.kicking = true;
        renderGroupList();
        renderResults();
        try {
          const data = await request(API_ROOT + '/kick', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              self_id: elements.botSelect.value,
              targets,
              reject_add: elements.rejectAdd.checked,
            }),
          });
          renderActionFailures(data.results);
          state.selectedUsers.clear();
          state.selectedTargetGroups.clear();
          state.kicking = false;
          await compare({ silent: true, preserveActionNotice: true });
          const message = data.failed_count
            ? '移群完成：成功 ' + data.success_count + ' 项，失败 ' + data.failed_count + ' 项'
            : '移群完成，共成功 ' + data.success_count + ' 项';
          showToast(message, data.failed_count ? 'error' : '');
        } catch (error) {
          showToast(error.message, 'error');
        } finally {
          state.kicking = false;
          renderGroupList();
          renderResults();
        }
      }

      function csvCell(value) {
        let text = String(value ?? '');
        if (/^[=+\-@\t\r]/.test(text)) text = "'" + text;
        return '"' + text.replace(/"/g, '""') + '"';
      }

      function exportCsv() {
        if (!state.duplicates.length) return;
        const rows = [['QQ', '显示名称', '重复群数', '所在群', '群内名称']];
        for (const member of state.duplicates) {
          rows.push([
            member.user_id,
            member.display_name,
            member.group_count,
            member.groups.map((group) => groupName(group.group_id) + ' (' + group.group_id + ')').join('；'),
            member.groups.map((group) => group.card || group.nickname || '').join('；'),
          ]);
        }
        const csv = '\ufeff' + rows.map((row) => row.map(csvCell).join(',')).join('\r\n');
        const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
        const link = document.createElement('a');
        link.href = url;
        link.download = '重复群成员_' + new Date().toISOString().slice(0, 10) + '.csv';
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      elements.groupList.addEventListener('change', (event) => {
        const input = event.target.closest('input[data-group-id]');
        if (!input) return;
        const groupId = input.dataset.groupId;
        if (input.checked) {
          if (state.selected.size >= MAX_GROUPS) {
            input.checked = false;
            showToast('一次最多选择 ' + MAX_GROUPS + ' 个群', 'error');
            return;
          }
          state.selected.add(groupId);
        } else {
          state.selected.delete(groupId);
        }
        renderGroupList();
      });

      elements.results.addEventListener('change', (event) => {
        const input = event.target.closest('input[data-user-id]');
        if (!input) return;
        const userId = String(input.dataset.userId);
        if (input.checked) state.selectedUsers.add(userId);
        else state.selectedUsers.delete(userId);
        renderResults();
      });
      elements.selectAllResults.addEventListener('change', () => {
        for (const member of filteredDuplicates()) {
          const userId = String(member.user_id);
          if (elements.selectAllResults.checked) state.selectedUsers.add(userId);
          else state.selectedUsers.delete(userId);
        }
        renderResults();
      });
      elements.targetGroups.addEventListener('change', (event) => {
        const input = event.target.closest('input[data-target-group]');
        if (!input) return;
        const groupId = String(input.dataset.targetGroup);
        if (input.checked) state.selectedTargetGroups.add(groupId);
        else state.selectedTargetGroups.delete(groupId);
        renderBulkBar();
      });
      elements.groupSearch.addEventListener('input', renderGroupList);
      elements.resultSearch.addEventListener('input', renderResults);
      elements.clearButton.addEventListener('click', () => {
        state.selected.clear();
        renderGroupList();
      });
      elements.selectVisibleButton.addEventListener('click', () => {
        const visible = visibleGroups();
        const allSelected = visible.length > 0 && visible.every((group) => state.selected.has(group.group_id));
        if (allSelected) {
          visible.forEach((group) => state.selected.delete(group.group_id));
        } else {
          for (const group of visible) {
            if (state.selected.size >= MAX_GROUPS) break;
            state.selected.add(group.group_id);
          }
          if (visible.length > MAX_GROUPS) showToast('已选择前 ' + MAX_GROUPS + ' 个群');
        }
        renderGroupList();
      });
      elements.botSelect.addEventListener('change', () => {
        localStorage.setItem('elainaqq_bot', elements.botSelect.value);
        state.stats = null;
        state.duplicates = [];
        state.selectedUsers.clear();
        state.selectedTargetGroups.clear();
        renderFailedGroups([]);
        renderActionFailures([]);
        renderResults();
        loadGroups();
      });
      elements.refreshButton.addEventListener('click', loadGroups);
      elements.compareButton.addEventListener('click', compare);
      elements.kickButton.addEventListener('click', kickSelected);
      elements.exportButton.addEventListener('click', exportCsv);

      async function initialize() {
        renderResults();
        try {
          if (await loadBots()) await loadGroups();
          else renderGroupList();
        } catch (error) {
          renderGroupList();
          showToast(error.message, 'error');
        }
      }

      initialize();
    })();
  </script>
</body>
</html>
