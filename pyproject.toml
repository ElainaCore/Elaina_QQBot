[project]
name = "elainaqq-onebot"
version = "1.0.1"
description = "兼容 OneBot v11 的 ElainaQQ 异步 QQ 机器人框架"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"

dependencies = [
    "aiohttp>=3.14.3",
    "pyyaml>=6.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.8",
    "types-PyYAML",
]

[tool.setuptools]
packages = []

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "modules/",
    "plugins/",
    "data/",
    "web/dist/",
]

[tool.ruff]
target-version = "py311"
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "single"
