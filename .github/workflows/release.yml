name: Build and release framework

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bump version
        id: version
        shell: bash
        run: echo "version=$(python scripts/release.py --bump)" >> "$GITHUB_OUTPUT"

      - name: Compile Python sources
        run: python -m compileall -q core web main.py

      - name: Commit version and tag
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add VERSION pyproject.toml
          git commit -m "chore: release v${VERSION} [skip ci]"
          git tag "v${VERSION}"
          git push origin HEAD:main --tags

      - name: Package source
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: git archive --format=zip --prefix="Elaina_QQBot-v${VERSION}/" -o "Elaina_QQBot-v${VERSION}.zip" "v${VERSION}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v${VERSION}" "Elaina_QQBot-v${VERSION}.zip" --title "ElainaQQ v${VERSION}" --generate-notes
