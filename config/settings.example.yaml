# ===== 框架全局设置 =====
# 修改后自动热加载，无需重启

# 网页服务器
server:
  host: "0.0.0.0"
  port: 5201

# 管理面板
web:
  admin_password: "admin"                  # 管理员密码
  trust_forwarded_headers: false           # 是否信任 X-Forwarded-For/X-Real-IP (仅在可信反向代理后开启, 直连开启会导致封禁被伪造头绕过)
  framework_name: "ElainaQQ"              # 产品名称
  favicon_url: ""                          # 网页图标 URL

# 主人配置
owner:
  ids:                                     # 主人 QQ 号列表
    - ""

# 内置 QQ 运行时
# 框架直接启动 QQNT，并为每个账号隔离数据目录
# 启用后，可直接在 Web 面板创建机器人并扫码登录
embedded_qq:
  enabled: true                                # 启用内置 QQ
  bridge_port_start: 30010                     # 本机账号桥接端口起点，后续账号依次递增
  command: ""                                  # 可选兼容启动命令；留空使用内置启动器
  qq_path: ""                                  # QQ.exe/qq 路径，留空自动探测
  packet_backend: "auto"                       # PB 原始发包后端；auto 自动匹配 QQ 精确版本
  packet_verbose: false                         # 输出原始包原生 Hook 详细日志
  packet_o3_hook: false                         # 原始包事件同时启用 O3 Hook 模式
  packet_bypass:                                # QQ 原生检测兼容项；仅按需开启
    hook: false
    window: false
    module: false
    process: false
    container: false
    js: false
  data_dir: "data/qq"                          # QQ 客户端、安装包和各账号数据统一目录
  headless: true                                # 是否以无界面模式启动 QQ
  single_process: false                         # Windows 可选：合并 Chromium 子进程
  rss_target_mb: 400                            # Linux 单账号 RSS 目标；0 表示仅回收文件页
  swap_reclaim: true                            # QQ 在线且 Swap 充足时换出匿名闲置页
  cgroup_helper: "/usr/local/sbin/elainaqq-cgroup"  # Linux 可选：受限 cgroup 辅助程序
  accounts: []                                  # 可选：启动时自动恢复的账号配置

# 日志配置
logging:
  dir: "log"                               # 日志根目录
  insert_interval: 2                       # 批量写入间隔(秒)
  max_batch_size: 500                      # 单次事务最多写入条数
  max_queue_entries: 100000                # 内存待写队列总上限
  retention_days: 30                       # 日志保留天数
  wal_mode: true                           # SQLite WAL模式

# 依赖管理
pip:
  auto_install: true                       # 自动安装模块/插件依赖
  mirror: ""                               # pip 镜像源

# 智能开发助手插件（plugins/ai_dev）
# 接入 OpenAI 兼容接口, 让 AI 自主编写/修改框架插件并提供 Web 面板 (/ai/)
ai:
  enabled: true
  base_url: "https://api.openai.com/v1"    # OpenAI 兼容接口地址 (NewAPI 中转填中转站 /v1)
  api_key: ""                              # 密钥; 留空则读取环境变量 AI_DEV_API_KEY / OPENAI_API_KEY
  model: "gpt-4.1-nano"                    # 默认模型
  temperature: 0.3
  max_iterations: 12                       # 单轮对话最大工具调用迭代步数
  request_timeout: 120                     # 单次请求超时(秒)
  system_prompt: ""                        # 可选: 覆盖默认系统提示词
